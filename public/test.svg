<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20010904//EN"
 "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg version="1.0" xmlns="http://www.w3.org/2000/svg"
 width="1024.000000pt" height="1024.000000pt" viewBox="0 0 1024.000000 1024.000000"
 preserveAspectRatio="xMidYMid meet">
 <style type="text/css">
    :root {
        --hover-color-light: #4a90e2;   /* Bleu clair pour le mode light */
        --hover-color-dark: #6ab0ff;    /* Bleu plus vif pour le mode dark */
        --base-color-light: #000000;    /* Noir pour le mode light */
        --base-color-dark: #ffffff;     /* Blanc pour le mode dark */
        --shadow-color-light: rgba(0,0,0,0.2);   /* Ombre légère pour le mode light */
        --shadow-color-dark: rgba(255,255,255,0.2);  /* Ombre légère pour le mode dark */
    }

    /* Styles de base */
    path {
        fill: var(--base-color-light);
        transition: fill 0.3s ease, transform 0.3s ease;
    }

    /* Mode dark */
    @media (prefers-color-scheme: dark) {
        path {
            fill: var(--base-color-dark);
        }
    }

    /* Effets de hover */
    svg:hover path {
        fill: var(--hover-color-light);
        transform: scale(1.02);
    }

    /* Hover en mode dark */
    @media (prefers-color-scheme: dark) {
        svg:hover path {
            fill: var(--hover-color-dark);
        }
    }

    /* Ombre de hover */
    svg:hover {
        filter: drop-shadow(0 0 10px var(--shadow-color-light));
    }

    /* Ombre de hover en mode dark */
    @media (prefers-color-scheme: dark) {
        svg:hover {
            filter: drop-shadow(0 0 10px var(--shadow-color-dark));
        }
    }
 </style>

<g transform="translate(0.000000,1024.000000) scale(0.100000,-0.100000)"
fill="#000000" stroke="none">
<!-- Le contenu précédent du SVG reste inchangé -->
</g>
</svg>